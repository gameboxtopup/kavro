<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password | Kavro Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{

background:#f1f5f9;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.card{

background:#fff;

width:420px;

padding:35px;

border-radius:20px;

box-shadow:0 20px 50px rgba(0,0,0,.08);

}

h2{

margin-bottom:25px;

color:#0f172a;

text-align:center;

}

.input-group{

margin-bottom:18px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

}

input{

width:100%;

padding:14px;

border:1px solid #d1d5db;

border-radius:10px;

font-size:15px;

}

button{

width:100%;

padding:15px;

background:#2563eb;

color:white;

border:none;

border-radius:10px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.message{

margin-top:20px;

text-align:center;

font-weight:bold;

}

.success{

color:green;

}

.error{

color:red;

}

</style>

</head>

<body>

<div class="card">

<h2>🔒 Change Password</h2>

<form id="passwordForm">

<div class="input-group">

<label>Current Password</label>

<input
type="password"
id="currentPassword"
required>

</div>

<div class="input-group">

<label>New Password</label>

<input
type="password"
id="newPassword"
required>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
required>

</div>

<button type="submit">

Update Password

</button>

<div id="message" class="message"></div>

</form>

</div>

<script>

const token = localStorage.getItem("adminToken");

if(!token){

window.location.href="admin-login.html";

}

document.getElementById("passwordForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const currentPassword=document.getElementById("currentPassword").value;

const newPassword=document.getElementById("newPassword").value;

const confirmPassword=document.getElementById("confirmPassword").value;

const msg=document.getElementById("message");

msg.className="message";

if(newPassword!==confirmPassword){

msg.textContent="Passwords do not match.";

msg.classList.add("error");

return;

}

try{

const response=await fetch("http://localhost:5000/api/admin/change-password",{

method:"PUT",

headers:{

"Content-Type":"application/json",

Authorization:"Bearer "+token

},

body:JSON.stringify({

currentPassword,

newPassword

})

});

const result=await response.json();

if(result.success){

msg.textContent="Password changed successfully. Please login again.";

msg.classList.add("success");

localStorage.removeItem("adminToken");

setTimeout(()=>{

window.location.href="admin-login.html";

},2000);

}else{

msg.textContent=result.message;

msg.classList.add("error");

}

}catch(err){

msg.textContent="Unable to connect to server.";

msg.classList.add("error");

console.error(err);

}

});

</script>

</body>

</html>
