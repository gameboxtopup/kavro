<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Kavro</title>

    <link
        rel="stylesheet"
        href="assets/css/auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your Kavro account
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    required
                >

                <label>Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Your password"
                    required
                >

                <div class="forgot">

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button
                type="button"
                class="google-button"
            >
                Continue with Google
            </button>

            <p class="bottom-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

    <script src="assets/js/login.js"></script>

</body>

</html>
