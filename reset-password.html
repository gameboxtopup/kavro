<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Kavro</title>

    <link
        rel="stylesheet"
        href="assets/css/auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Reset Password</h1>

            <p class="subtitle">
                Create a new password for your account.
            </p>

            <form id="resetPasswordForm">

                <label>New Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="New password"
                    minlength="6"
                    required
                >

                <label>Confirm Password</label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm password"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    class="auth-button"
                >
                    Reset Password
                </button>

            </form>

            <p class="bottom-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script src="assets/js/reset-password.js"></script>

</body>

</html>
