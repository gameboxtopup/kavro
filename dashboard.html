<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kavro - My Dashboard</title>

    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body>

<header class="dashboard-header">

    <div class="logo">
        Kavro
    </div>

    <div class="header-right">

        <span id="userName">
            Guest
        </span>

        <button id="logoutButton">
            Logout
        </button>

    </div>

</header>


<main class="dashboard-container">

    <section class="welcome-section">

        <h1>
            Welcome, <span id="welcomeName">Guest</span> 👋
        </h1>

        <p>
            Track your orders and contact Kavro support.
        </p>

    </section>


    <!-- ORDER STATUS -->

    <section class="dashboard-card">

        <div class="card-header">

            <h2>
                My Orders
            </h2>

            <button
                id="refreshOrders"
                class="refresh-btn"
            >
                ↻ Refresh
            </button>

        </div>


        <div id="ordersContainer">

            <div class="loading">
                Loading your orders...
            </div>

        </div>

    </section>


    <!-- LIVE CHAT -->

    <section class="dashboard-card chat-card">

        <div class="card-header">

            <h2>
                💬 Live Chat
            </h2>

            <span class="online-dot">
                ● Admin
            </span>

        </div>


        <div
            id="chatMessages"
            class="chat-messages"
        >

            <div class="chat-empty">

                <div class="chat-icon">
                    💬
                </div>

                <p>
                    Need help with your order?
                </p>

                <small>
                    Send a message to Kavro support.
                </small>

            </div>

        </div>


        <form
            id="chatForm"
            class="chat-form"
        >

            <input
                type="text"
                id="chatInput"
                placeholder="Type your message..."
                maxlength="500"
                autocomplete="off"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </section>


</main>


<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="assets/js/dashboard.js"></script>

</body>
</html>
