<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kavro - My Dashboard</title>

    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="dashboard-header">

    <div class="logo">
        <a href="index.html">Kavro</a>
    </div>

    <div class="header-right">

        <div class="user-info">
            <strong id="userName">Customer</strong>
            <small id="userEmail"></small>
        </div>

        <button id="logoutBtn" class="logout-btn">
            Sign Out
        </button>

    </div>

</header>

<nav class="dashboard-nav">

    <button
        class="dashboard-tab active"
        data-tab="orders"
    >
        📦 My Orders
    </button>

    <button
        class="dashboard-tab"
        data-tab="password"
    >
        🔒 Change Password
    </button>

    <button
        class="dashboard-tab"
        data-tab="chat"
    >
        💬 Chat with Admin
    </button>

</nav>

<main class="dashboard-container">

    <section class="welcome-section">

        <h1>
            Welcome,
            <span id="welcomeName">User</span>
            👋
        </h1>

        <p>
            Track your orders and contact Kavro support.
        </p>

    </section>


    <!-- ORDER STATUS -->

    <section
    id="ordersTab"
    class="dashboard-card dashboard-tab-content"
    >

        <div class="card-header">

            <h2>
                My Orders
            </h2>

            <button
                id="refreshOrders"
                class="refresh-btn"
            >
                ↻ Refresh
            </button>

        </div>


        <div id="ordersContainer">

            <div class="loading">
                Loading your orders...
            </div>

        </div>

    </section>


<section
    id="passwordTab"
    class="dashboard-card dashboard-tab-content"
    style="display:none;"
>

    <div class="card-header">

        <h2>🔒 Change Password</h2>

    </div>

    <form id="changePasswordForm">

        <label>Current Password</label>

        <input
            type="password"
            id="currentPassword"
            required
        >

        <label>New Password</label>

        <input
            type="password"
            id="newPassword"
            minlength="6"
            required
        >

        <label>Confirm New Password</label>

        <input
            type="password"
            id="confirmPassword"
            minlength="6"
            required
        >

        <button type="submit">
            Change Password
        </button>

    </form>

</section>

    <!-- LIVE CHAT -->

    <section
    id="chatTab"
    class="dashboard-card chat-card dashboard-tab-content"
    style="display:none;"
    >

        <div class="card-header">

            <h2>
                💬 Live Chat
            </h2>

            <span class="online-dot">
                ● Admin
            </span>

        </div>


        <div
            id="chatMessages"
            class="chat-messages"
        >

            <div class="chat-empty">

                <div class="chat-icon">
                    💬
                </div>

                <p>
                    Need help with your order?
                </p>

                <small>
                    Send a message to Kavro support.
                </small>

            </div>

        </div>


        <form
            id="chatForm"
            class="chat-form"
        >

            <input
                type="text"
                id="chatInput"
                placeholder="Type your message..."
                maxlength="500"
                autocomplete="off"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </section>


</main>


<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="assets/js/dashboard.js"></script>

<button
    class="floating-chat-btn"
    onclick="window.location.href='dashboard.html#chat'"
>
    💬
    <span>Chat with Admin</span>
</button>

</body>
</html>
