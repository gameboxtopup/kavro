<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order | Kavro</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="tracking-page">
    <div class="tracking-card">
        <a href="index.html" class="tracking-logo">Kavro</a>
        <h1>Track your order</h1>
        <p>Enter the two private codes shown after checkout.</p>

        <form id="trackingForm">
            <label for="orderNumber">Order number</label>
            <input id="orderNumber" placeholder="KAV-..." autocomplete="off" required>

            <label for="trackingCode">Tracking code</label>
            <input id="trackingCode" placeholder="Private tracking code" autocomplete="off" required>

            <button type="submit" class="btn-primary">Check Status</button>
        </form>

        <div id="trackingResult" class="tracking-result" hidden></div>
        <a href="products.html" class="tracking-back">← Continue shopping</a>
    </div>
</section>

<script>
const form = document.getElementById("trackingForm");
const resultBox = document.getElementById("trackingResult");
const recentOrder = JSON.parse(sessionStorage.getItem("kavroLastOrder") || "null");

if (recentOrder?.orderNumber && recentOrder?.trackingCode) {
    document.getElementById("orderNumber").value = recentOrder.orderNumber;
    document.getElementById("trackingCode").value = recentOrder.trackingCode;
}

form.addEventListener("submit", async event => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    button.textContent = "Checking...";
    resultBox.hidden = true;

    try {
        const response = await fetch("https://kavro-api.onrender.com/api/orders/track", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                orderNumber: document.getElementById("orderNumber").value,
                trackingCode: document.getElementById("trackingCode").value
            })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.message || "Order could not be found.");
        }

        const order = data.order;
        resultBox.className = "tracking-result success";
        resultBox.innerHTML = `
            <h2>${escapeHtml(order.status)}</h2>
            <p><strong>${escapeHtml(order.orderNumber)}</strong></p>
            <p>${escapeHtml(order.product)} — ${escapeHtml(order.package)}</p>
            <p>${escapeHtml(order.price)}</p>`;
        resultBox.hidden = false;
    } catch (error) {
        resultBox.className = "tracking-result error";
        resultBox.textContent = error.message;
        resultBox.hidden = false;
    } finally {
        button.disabled = false;
        button.textContent = "Check Status";
    }
});

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
