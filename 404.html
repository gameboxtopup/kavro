<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | Kavro</title>

<meta name="description" content="The page you're looking for couldn't be found. Return to Kavro's homepage or explore our digital products and services.">

<meta name="robots" content="noindex">

<meta name="theme-color" content="#2563eb">

<link rel="icon" href="assets/images/favicon.png">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

.error-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;
text-align:center;
}

.error-box{
max-width:700px;
background:#fff;
padding:60px 40px;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.error-number{
font-size:120px;
font-weight:800;
line-height:1;
margin:0;
color:#2563eb;
}

.error-title{
font-size:42px;
font-weight:700;
margin:20px 0;
color:#0f172a;
}

.error-text{
font-size:18px;
line-height:1.8;
color:#64748b;
margin-bottom:40px;
}

.error-buttons{
display:flex;
justify-content:center;
gap:18px;
flex-wrap:wrap;
}

.error-buttons a{
text-decoration:none;
}

@media(max-width:768px){

.error-number{
font-size:80px;
}

.error-title{
font-size:30px;
}

.error-box{
padding:40px 25px;
}

}

</style>

</head>

<body>

<section class="error-page">

<div class="error-box">

<p class="hero-tag">

404 Error

</p>

<h1 class="error-number">

404

</h1>

<h2 class="error-title">

Oops! Page Not Found

</h2>

<p class="error-text">

The page you're looking for may have been moved, renamed, or no longer exists.

You can return to the homepage or continue exploring our digital marketplace.

</p>

<div class="error-buttons">

<a href="index.html" class="btn-primary">

🏠 Back to Home

</a>

<a href="products.html" class="btn-secondary">

🛒 Browse Products

</a>

</div>

</div>

</section>

<script src="assets/js/main.js"></script>

</body>

</html>
