<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Kavro</title>

    <link
        rel="stylesheet"
        href="assets/css/auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Enter your email and we'll send you
                a password reset link.
            </p>

            <form id="forgotPasswordForm">

                <label>Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    required
                >

                <button
                    type="submit"
                    class="auth-button"
                >
                    Send Reset Link
                </button>

            </form>

            <p class="bottom-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script src="assets/js/forgot-password.js"></script>

</body>

</html>
