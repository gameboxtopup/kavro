<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMM Services | Kavro</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1000px;margin:60px auto;padding:20px}.tabs{display:flex;gap:10px}.tabs button{flex:1;padding:14px;border:1px solid #334155;border-radius:10px;background:#111827;color:#fff;font-weight:700}.tabs .active{background:#2563eb}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:20px}.card{padding:18px;border:1px solid #334155;border-radius:14px}.card input{width:100%;box-sizing:border-box;padding:10px;margin:12px 0;background:#111827;color:#fff;border:1px solid #475569;border-radius:8px}.buy{display:block;text-align:center;background:#2563eb;color:#fff;padding:10px;border-radius:8px;text-decoration:none}.price{display:block;color:#60a5fa;font-size:20px;font-weight:800}</style></head>
<body><main class="wrap"><a href="products.html">← Products</a><h1>SMM Services</h1><p>Choose a service and quantity. Payment is verified manually.</p><div class="tabs"><button class="active" data-tab="instagram">Instagram Services</button><button data-tab="tiktok">TikTok Services</button></div><section id="instagram" class="panel active"><div id="instagramGrid" class="grid">Loading...</div></section><section id="tiktok" class="panel"><div id="tiktokGrid" class="grid">Loading...</div></section></main>
<script>
const API="https://kavro-api.onrender.com";
const slug=new URLSearchParams(location.search).get("product")||"smmservices";
document.querySelectorAll(".tabs button").forEach(button=>button.onclick=()=>{document.querySelectorAll(".tabs button,.panel").forEach(x=>x.classList.remove("active"));button.classList.add("active");document.getElementById(button.dataset.tab).classList.add("active")});
function makeCard(item,product){const name=item.name||item.title||"SMM Service";const rate=Number(item.price)||0;const min=item.minQuantity||10;const max=item.maxQuantity||1000000;const serviceId=item.serviceId||"";return `<article class="card"><strong>${name}</strong><small>Rate: NPR ${rate} per 1,000</small><input class="qty" type="number" min="${min}" max="${max}" value="${min}" data-rate="${rate}" data-service="${serviceId}" data-name="${name}"><span class="price">NPR ${Math.ceil(min*rate/1000)}</span><br><a class="buy" href="#">Continue</a></article>`}
function wire(root,product){root.querySelectorAll(".card").forEach(card=>{const input=card.querySelector(".qty"),price=card.querySelector(".price"),buy=card.querySelector(".buy");function update(){let q=Number(input.value)||Number(input.min);q=Math.max(Number(input.min),Math.min(Number(input.max),q));input.value=q;price.textContent=`NPR ${Math.ceil(q*Number(input.dataset.rate)/1000)}`;buy.href=`order.html?type=smm&serviceId=${encodeURIComponent(input.dataset.service)}&product=${encodeURIComponent(product.name)}&package=${encodeURIComponent(input.dataset.name)}&price=${encodeURIComponent(price.textContent)}&quantity=${q}`}input.oninput=update;update()})}
(async()=>{try{const product=await(await fetch(`${API}/api/products/slug/${encodeURIComponent(slug)}`)).json();const response=await(await fetch(`${API}/api/product-items/product/${product._id}`)).json();const items=(response.items||response.data||response).filter(x=>x.active!==false);const instagram=items.filter(x=>String(x.name||x.title||"").toLowerCase().includes("instagram"));const tiktok=items.filter(x=>String(x.name||x.title||"").toLowerCase().includes("tiktok"));const ig=document.getElementById("instagramGrid"),tt=document.getElementById("tiktokGrid");ig.innerHTML=instagram.map(x=>makeCard(x,product)).join("")||"No Instagram services";tt.innerHTML=tiktok.map(x=>makeCard(x,product)).join("")||"No TikTok services";wire(ig,product);wire(tt,product)}catch(error){document.getElementById("instagramGrid").textContent="Unable to load services";console.error(error)}})();
</script></body></html>
<script src="assets/js/shop-hours.js"></script>
