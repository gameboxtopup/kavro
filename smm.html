<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMM Packages | Kavro</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:900px;margin:80px auto;padding:20px"><a href="products.html">← Products</a><h1 id="title">SMM Packages</h1><p>Choose a package. Payment is verified manually before delivery.</p><div id="packages">Loading packages...</div></main><script>
const API="https://kavro-api.onrender.com";const slug=new URLSearchParams(location.search).get("product");const box=document.getElementById("packages");
(async()=>{try{const p=await (await fetch(API+"/api/products/slug/"+encodeURIComponent(slug))).json();document.getElementById("title").textContent=p.name||"SMM Packages";const items=await (await fetch(API+"/api/product-items/product/"+p._id)).json();const list=items.items||items.data||items;box.innerHTML=(Array.isArray(list)?list:[]).filter(x=>x.active!==false).map(x=>`<a style="display:block;padding:18px;margin:12px 0;border:1px solid #334155;border-radius:12px;color:inherit;text-decoration:none" href="order.html?type=smm&serviceId=${encodeURIComponent(x.serviceId||x.service||'')}&product=${encodeURIComponent(p.name)}&package=${encodeURIComponent(x.name||x.title)}&price=${encodeURIComponent(x.price)}&quantity=${x.quantity||1}"><strong>${x.name||x.title}</strong><br>NPR ${x.price}<br><small>View package →</small></a>`).join("")||"No packages available yet."}catch(e){box.textContent="Unable to load packages."}})();</script></body></html>
