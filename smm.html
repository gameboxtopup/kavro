<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMM Services | Kavro</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .smm-page {
      max-width: 1000px;
      margin: 60px auto;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin: 25px 0;
    }

    .tab {
      flex: 1;
      padding: 15px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: #2563eb;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
    }

    .service-card {
      padding: 18px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #0f172a;
      cursor: pointer;
    }

    .service-card.selected {
      border-color: #60a5fa;
      background: #172554;
    }

    .service-card h3 {
      margin: 0 0 10px;
    }

    .service-rate {
      color: #60a5fa;
      font-weight: 800;
    }

    .order-box {
      display: none;
      margin-top: 25px;
      padding: 22px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #111827;
    }

    .order-box.active {
      display: block;
    }

    .order-box input {
      width: 100%;
      box-sizing: border-box;
      margin: 12px 0;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    .total {
      display: block;
      margin: 12px 0;
      color: #60a5fa;
      font-size: 22px;
      font-weight: 800;
    }

    .continue-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="smm-page">
    <a href="products.html">← Products</a>

    <h1>SMM Services</h1>
    <p>Select a service, then enter your required quantity.</p>

    <div class="tabs">
      <button class="tab active" data-platform="instagram">
        Instagram Services
      </button>

      <button class="tab" data-platform="tiktok">
        TikTok Services
      </button>
    </div>

    <div id="services" class="services">
      Loading services...
    </div>

    <div id="orderBox" class="order-box">
      <h2 id="selectedName">Select a service</h2>

      <p id="selectedRate"></p>

      <label for="targetUrl">
        Video/Post/reels link
      </label>

      <input
        id="targetUrl"
        type="url"
        placeholder="https://instagram.com/..."
        required
      >

      <label for="quantity">
        Enter quantity
      </label>

      <input
        id="quantity"
        type="number"
        placeholder="Example: 5000"
        min="10"
        required
      >

      <small id="quantityHelp"></small>

      <span id="totalPrice" class="total">
        Total: NPR 0
      </span>

      <button id="continueBtn" class="continue-btn">
        Continue to Order
      </button>
    </div>
  </main>

  <script>
    const API = "https://kavro-api.onrender.com";

    const params = new URLSearchParams(location.search);
    const slug = params.get("product") || "smmservices";

    const servicesBox = document.getElementById("services");
    const orderBox = document.getElementById("orderBox");
    const selectedName = document.getElementById("selectedName");
    const selectedRate = document.getElementById("selectedRate");
    const quantityInput = document.getElementById("quantity");
    const quantityHelp = document.getElementById("quantityHelp");
    const totalPrice = document.getElementById("totalPrice");
    const targetUrl = document.getElementById("targetUrl");
    const continueBtn = document.getElementById("continueBtn");

    let productData = null;
    let allServices = [];
    let activePlatform = "instagram";
    let selectedService = null;

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(item => {
          item.classList.remove("active");
        });

        tab.classList.add("active");
        activePlatform = tab.dataset.platform;
        selectedService = null;
        orderBox.classList.remove("active");

        renderServices();
      });
    });

    function getServicePlatform(service) {
      const text = String(
        service.name || service.title || ""
      ).toLowerCase();

      if (text.includes("instagram")) return "instagram";
      if (text.includes("tiktok")) return "tiktok";

      return "";
    }

    function renderServices() {
      const visibleServices = allServices.filter(service =>
        getServicePlatform(service) === activePlatform
      );

      if (!visibleServices.length) {
        servicesBox.innerHTML =
          "<p>No services available for this platform.</p>";
        return;
      }

      servicesBox.innerHTML = visibleServices.map(service => {
        const name = service.name || service.title;
        const rate = Number(service.price) || 0;

        return `
          <article
            class="service-card"
            data-id="${service._id}"
          >
            <h3>${name}</h3>
            <div class="service-rate">
              NPR ${rate} per 1,000
            </div>
            <small>Click to select</small>
          </article>
        `;
      }).join("");

      document.querySelectorAll(".service-card").forEach(card => {
        card.addEventListener("click", () => {
          const service = allServices.find(
            item => item._id === card.dataset.id
          );

          selectService(service, card);
        });
      });
    }

    function selectService(service, card) {
      document.querySelectorAll(".service-card").forEach(item => {
        item.classList.remove("selected");
      });

      card.classList.add("selected");
      selectedService = service;

      const name = service.name || service.title;
      const rate = Number(service.price) || 0;
      const minimum = Number(service.minQuantity) || 10;
      const maximum = Number(service.maxQuantity) || 1000000;

      selectedName.textContent = name;
      selectedRate.textContent =
        `Rate: NPR ${rate} per 1,000`;

      quantityInput.min = minimum;
      quantityInput.max = maximum;
      quantityInput.value = "";
      quantityHelp.textContent =
        `Minimum: ${minimum} | Maximum: ${maximum}`;

      totalPrice.textContent = "Total: NPR 0";
      orderBox.classList.add("active");

      window.scrollTo({
        top: orderBox.offsetTop - 30,
        behavior: "smooth"
      });
    }

    quantityInput.addEventListener("input", () => {
      if (!selectedService) return;

      const quantity = Number(quantityInput.value) || 0;
      const rate = Number(selectedService.price) || 0;

      if (quantity > 0) {
        const total = Math.ceil(quantity * rate / 1000);
        totalPrice.textContent = `Total: NPR ${total}`;
      } else {
        totalPrice.textContent = "Total: NPR 0";
      }
    });

    continueBtn.addEventListener("click", () => {
      if (!selectedService) {
        alert("Please select a service first.");
        return;
      }

      const link = targetUrl.value.trim();
      const quantity = Number(quantityInput.value);

      if (!link) {
        alert("Please enter the Instagram/TikTok link.");
        return;
      }

      if (!quantity || quantity < Number(quantityInput.min)) {
        alert(`Minimum quantity is ${quantityInput.min}.`);
        return;
      }

      if (quantity > Number(quantityInput.max)) {
        alert(`Maximum quantity is ${quantityInput.max}.`);
        return;
      }

      const name = selectedService.name || selectedService.title;
      const rate = Number(selectedService.price) || 0;
      const total = Math.ceil(quantity * rate / 1000);
      const serviceId = selectedService.serviceId || "";

      const url =
        "order.html" +
        "?type=smm" +
        "&serviceId=" + encodeURIComponent(serviceId) +
        "&product=" + encodeURIComponent(productData.name) +
        "&package=" + encodeURIComponent(name) +
        "&price=" + encodeURIComponent(`NPR ${total}`) +
        "&quantity=" + quantity +
        "&targetUrl=" + encodeURIComponent(link);

      window.location.href = url;
    });

    async function loadServices() {
      try {
        const productResponse = await fetch(
          `${API}/api/products/slug/${encodeURIComponent(slug)}`
        );

        productData = await productResponse.json();

        const itemsResponse = await fetch(
          `${API}/api/product-items/product/${productData._id}`
        );

        const result = await itemsResponse.json();

        allServices =
          result.items ||
          result.data ||
          result;

        allServices = allServices.filter(
          service => service.active !== false
        );

        renderServices();
      } catch (error) {
        console.error(error);
        servicesBox.innerHTML =
          "<p>Unable to load SMM services.</p>";
      }
    }

    loadServices();
  </script>
</body>
</html>
