<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SMM Services | Kavro</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .wrap {
      max-width: 1000px;
      margin: 60px auto;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
    }

    .tabs button {
      flex: 1;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: #2563eb;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      padding: 18px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #0f172a;
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
    }

    .card input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 12px 0;
      background: #111827;
      color: white;
      border: 1px solid #475569;
      border-radius: 8px;
    }

    .price {
      display: block;
      color: #60a5fa;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .buy {
      display: block;
      text-align: center;
      background: #2563eb;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <a href="products.html">← Products</a>

    <h1>SMM Services</h1>

    <p>
      Choose a service and quantity. Payment is verified manually.
    </p>

    <div class="tabs">
      <button class="active" data-tab="instagram">
        Instagram Services
      </button>

      <button data-tab="tiktok">
        TikTok Services
      </button>
    </div>

    <section id="instagram" class="panel active">
      <div id="instagramGrid" class="grid">
        Loading...
      </div>
    </section>

    <section id="tiktok" class="panel">
      <div id="tiktokGrid" class="grid">
        Loading...
      </div>
    </section>
  </main>

  <script>
    const API = "https://kavro-api.onrender.com";

    const slug =
      new URLSearchParams(location.search).get("product") ||
      "smmservices";

    document.querySelectorAll(".tabs button").forEach(button => {
      button.onclick = () => {
        document
          .querySelectorAll(".tabs button, .panel")
          .forEach(element => element.classList.remove("active"));

        button.classList.add("active");

        document
          .getElementById(button.dataset.tab)
          .classList.add("active");
      };
    });

    function makeCard(item, product) {
      const name = item.name || item.title || "SMM Service";
      const rate = Number(item.price) || 0;
      const minimum = item.minQuantity || 10;
      const maximum = item.maxQuantity || 1000000;
      const serviceId = item.serviceId || "";

      return `
        <article class="card">
          <strong>${name}</strong>

          <small>
            Rate: NPR ${rate} per 1,000
          </small>

          <input
            class="qty"
            type="number"
            min="${minimum}"
            max="${maximum}"
            value="${minimum}"
            data-rate="${rate}"
            data-service="${serviceId}"
            data-name="${name}"
          >

          <span class="price">
            NPR ${Math.ceil(minimum * rate / 1000)}
          </span>

          <a class="buy" href="#">
            Continue
          </a>
        </article>
      `;
    }

    function connectCards(container, product) {
      container.querySelectorAll(".card").forEach(card => {
        const quantityInput = card.querySelector(".qty");
        const price = card.querySelector(".price");
        const buyButton = card.querySelector(".buy");

        function updatePrice() {
          let quantity =
            Number(quantityInput.value) ||
            Number(quantityInput.min);

          quantity = Math.max(
            Number(quantityInput.min),
            Math.min(Number(quantityInput.max), quantity)
          );

          quantityInput.value = quantity;

          const total = Math.ceil(
            quantity * Number(quantityInput.dataset.rate) / 1000
          );

          price.textContent = `NPR ${total}`;

          buyButton.href =
            "order.html" +
            "?type=smm" +
            "&serviceId=" +
            encodeURIComponent(quantityInput.dataset.service) +
            "&product=" +
            encodeURIComponent(product.name) +
            "&package=" +
            encodeURIComponent(quantityInput.dataset.name) +
            "&price=" +
            encodeURIComponent(`NPR ${total}`) +
            "&quantity=" +
            quantity;
        }

        quantityInput.addEventListener("input", updatePrice);
        updatePrice();
      });
    }

    async function loadServices() {
      try {
        const productResponse = await fetch(
          `${API}/api/products/slug/${encodeURIComponent(slug)}`
        );

        const product = await productResponse.json();

        const itemsResponse = await fetch(
          `${API}/api/product-items/product/${product._id}`
        );

        const result = await itemsResponse.json();

        const items =
          result.items ||
          result.data ||
          result;

        const activeItems = Array.isArray(items)
          ? items.filter(item => item.active !== false)
          : [];

        const instagramItems = activeItems.filter(item =>
          String(item.name || item.title || "")
            .toLowerCase()
            .includes("instagram")
        );

        const tiktokItems = activeItems.filter(item =>
          String(item.name || item.title || "")
            .toLowerCase()
            .includes("tiktok")
        );

        const instagramGrid =
          document.getElementById("instagramGrid");

        const tiktokGrid =
          document.getElementById("tiktokGrid");

        instagramGrid.innerHTML =
          instagramItems.length
            ? instagramItems
                .map(item => makeCard(item, product))
                .join("")
            : "<p>No Instagram services available.</p>";

        tiktokGrid.innerHTML =
          tiktokItems.length
            ? tiktokItems
                .map(item => makeCard(item, product))
                .join("")
            : "<p>No TikTok services available.</p>";

        connectCards(instagramGrid, product);
        connectCards(tiktokGrid, product);

      } catch (error) {
        console.error(error);

        document.getElementById("instagramGrid").innerHTML =
          "<p>Unable to load Instagram services.</p>";

        document.getElementById("tiktokGrid").innerHTML =
          "<p>Unable to load TikTok services.</p>";
      }
    }

    loadServices();
  </script>
</body>
</html>
