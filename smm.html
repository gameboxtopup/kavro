<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMM Services | Kavro</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .smm-page {
      max-width: 1050px;
      margin: 70px auto;
      padding: 24px;
    }

    .smm-tabs {
      display: flex;
      gap: 12px;
      margin: 28px 0;
    }

    .smm-tab {
      flex: 1;
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #111b2f;
      color: #cbd5e1;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .smm-tab.active {
      background: #2563eb;
      color: white;
      border-color: #60a5fa;
    }

    .smm-panel {
      display: none;
    }

    .smm-panel.active {
      display: block;
    }

    .smm-panel h2 {
      color: #60a5fa;
      margin-bottom: 18px;
    }

    .smm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .smm-card {
      display: block;
      padding: 20px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.85);
      color: inherit;
      text-decoration: none;
      transition: 0.2s;
    }

    .smm-card:hover {
      border-color: #60a5fa;
      transform: translateY(-3px);
    }

    .smm-card strong {
      display: block;
      margin-bottom: 12px;
    }

    .smm-price {
      color: #60a5fa;
      font-size: 20px;
      font-weight: 800;
    }

    .muted {
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      .smm-tabs {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="smm-page">
    <a href="products.html">← Products</a>

    <h1 id="pageTitle">SMM Services</h1>

    <p class="muted">
      Choose Instagram or TikTok services. Payment is verified manually before delivery.
    </p>

    <div class="smm-tabs">
      <button class="smm-tab active" data-platform="instagram">
        Instagram Services
      </button>

      <button class="smm-tab" data-platform="tiktok">
        TikTok Services
      </button>
    </div>

    <section id="instagram" class="smm-panel active">
      <h2>Instagram Services</h2>
      <div id="instagramGrid" class="smm-grid">
        Loading Instagram services...
      </div>
    </section>

    <section id="tiktok" class="smm-panel">
      <h2>TikTok Services</h2>
      <div id="tiktokGrid" class="smm-grid">
        Loading TikTok services...
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://kavro-api.onrender.com";
    const params = new URLSearchParams(window.location.search);
    const productSlug = params.get("product") || "smmservices";

    const instagramGrid = document.getElementById("instagramGrid");
    const tiktokGrid = document.getElementById("tiktokGrid");

    document.querySelectorAll(".smm-tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".smm-tab").forEach(tab => {
          tab.classList.remove("active");
        });

        document.querySelectorAll(".smm-panel").forEach(panel => {
          panel.classList.remove("active");
        });

        button.classList.add("active");

        const panel = document.getElementById(button.dataset.platform);
        panel.classList.add("active");
      });
    });

    function createServiceCard(item, product) {
      const name = item.name || item.title || "SMM Service";

      const quantity =
        item.quantity ||
        Number(String(name).replace(/[^0-9]/g, "")) ||
        1000;

      const serviceId =
        item.serviceId ||
        item.service ||
        "";

      return `
        <a
          class="smm-card"
          href="order.html?type=smm
          &serviceId=${encodeURIComponent(serviceId)}
          &product=${encodeURIComponent(product.name)}
          &package=${encodeURIComponent(name)}
          &price=${encodeURIComponent(item.price)}
          &quantity=${quantity}"
        >
          <strong>${name}</strong>

          <span class="smm-price">
            NPR ${item.price}
          </span>

          <br><br>
          <small>View package →</small>
        </a>
      `;
    }

    async function loadServices() {
      try {
        const productResponse = await fetch(
          `${API_URL}/api/products/slug/${encodeURIComponent(productSlug)}`
        );

        const product = await productResponse.json();

        const itemsResponse = await fetch(
          `${API_URL}/api/product-items/product/${product._id}`
        );

        const result = await itemsResponse.json();

        const items =
          result.items ||
          result.data ||
          result;

        const activeItems = Array.isArray(items)
          ? items.filter(item => item.active !== false)
          : [];

        const instagramItems = activeItems.filter(item =>
          String(item.name || item.title || "")
            .toLowerCase()
            .includes("instagram")
        );

        const tiktokItems = activeItems.filter(item =>
          String(item.name || item.title || "")
            .toLowerCase()
            .includes("tiktok")
        );

        instagramGrid.innerHTML = instagramItems.length
          ? instagramItems
              .map(item => createServiceCard(item, product))
              .join("")
          : `<p class="muted">No Instagram services available.</p>`;

        tiktokGrid.innerHTML = tiktokItems.length
          ? tiktokItems
              .map(item => createServiceCard(item, product))
              .join("")
          : `<p class="muted">No TikTok services available.</p>`;
      } catch (error) {
        console.error("SMM loading error:", error);

        instagramGrid.innerHTML =
          `<p class="muted">Unable to load Instagram services.</p>`;

        tiktokGrid.innerHTML =
          `<p class="muted">Unable to load TikTok services.</p>`;
      }
    }

    loadServices();
  </script>
</body>
</html>
