<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMM Services | Kavro</title><link rel="stylesheet" href="style.css"><style>
:root{--b:#2563eb;--l:#263754;--p:#111b2f}*{box-sizing:border-box}body{margin:0;background:#070d19;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1080px,100%);margin:auto;padding:28px 18px 90px}.back{color:#93c5fd;text-decoration:none}.hero{padding:28px 0 20px}.hero h1{font-size:clamp(28px,5vw,46px);margin:10px 0}.hero p{color:#94a3b8}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.tab{border:1px solid var(--l);background:var(--p);color:#cbd5e1;border-radius:12px;padding:15px 10px;font-weight:800;cursor:pointer}.tab.active{background:var(--b);color:#fff;border-color:#60a5fa}.panel{display:none}.panel.active{display:block}.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.service{border:1px solid var(--l);background:linear-gradient(145deg,#111b2f,#0d1627);border-radius:14px;padding:18px;cursor:pointer;transition:.2s}.service:hover,.service.selected{border-color:#60a5fa;transform:translateY(-2px)}.service h3{margin:0 0 8px}.service p{margin:0;color:#60a5fa;font-weight:800}.service small,.hint{display:block;color:#94a3b8;margin-top:8px}.empty{color:#94a3b8;padding:20px 0}.order-box{display:none;margin-top:18px;border:1px solid #3b82f6;background:#101d35;border-radius:16px;padding:18px}.order-box.show{display:block}.order-box label{display:block;font-weight:700;margin:14px 0 7px}.order-box input{width:100%;padding:13px;border-radius:9px;border:1px solid #475569;background:#081225;color:#fff;font-size:16px}.total{font-size:25px;color:#60a5fa;font-weight:900;margin:18px 0}.continue{display:block;text-align:center;text-decoration:none;background:var(--b);color:white;padding:14px;border-radius:10px;font-weight:800}.continue.disabled{opacity:.5;pointer-events:none}@media(max-width:600px){.wrap{padding:20px 12px 70px}.services{grid-template-columns:1fr}.service{padding:15px}.tabs{position:sticky;top:0;z-index:2;background:#070d19;padding:8px 0}}
</style></head><body><main class="wrap"><a class="back" href="products.html">← Products</a><section class="hero"><h1>SMM Services</h1><p>Choose a platform, select a service, then enter your quantity.</p></section><div class="tabs"><button class="tab active" data-platform="instagram">Instagram Services</button><button class="tab" data-platform="tiktok">TikTok Services</button></div><section id="instagram" class="panel active"><div id="instagramServices" class="services">Loading...</div></section><section id="tiktok" class="panel"><div id="tiktokServices" class="services">Loading...</div></section><section id="orderBox" class="order-box"><strong id="selectedName">Select a service</strong><label for="target">Post or profile link</label><input id="target" type="url" placeholder="https://instagram.com/..." required><label for="quantity">Quantity</label><input id="quantity" type="number" min="10" value="1000" inputmode="numeric"><div class="hint" id="limits"></div><div class="total" id="total">Total: NPR 0</div><a id="continue" class="continue disabled" href="#">Continue to Order</a></section></main><script>
const API='https://kavro-api.onrender.com',slug=new URLSearchParams(location.search).get('product')||'smmservices';let product,selected=null;const $=id=>document.getElementById(id),box=$('orderBox'),qty=$('quantity'),target=$('target'),total=$('total'),go=$('continue');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.platform).classList.add('active');box.classList.remove('show');selected=null});function draw(items,root){root.innerHTML=items.length?items.map((x,i)=>`<article class="service" data-i="${i}"><h3>${x.name||x.title||'SMM Service'}</h3><p>NPR ${Number(x.price)||0} per 1,000</p><small>Click to select</small></article>`).join(''):'<div class="empty">No services available yet.</div>';root.querySelectorAll('.service').forEach((el,i)=>el.onclick=()=>select(items[i],el))}function select(item,el){document.querySelectorAll('.service').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=item;const min=Number(item.minQuantity)||10,max=Number(item.maxQuantity)||1000000;qty.min=min;qty.max=max;qty.value=Math.max(min,1000);$('selectedName').textContent=item.name||item.title;$('limits').textContent=`Minimum: ${min.toLocaleString()} • Maximum: ${max.toLocaleString()}`;box.classList.add('show');update();box.scrollIntoView({behavior:'smooth',block:'nearest'})}function update(){if(!selected)return;const min=Number(qty.min),max=Number(qty.max);let n=Number(qty.value)||min;n=Math.max(min,Math.min(max,Math.floor(n)));qty.value=n;const price=Math.ceil(n*(Number(selected.price)||0)/1000);total.textContent=`Total: NPR ${price.toLocaleString()}`;const link=target.value.trim();go.classList.toggle("disabled",!(link.startsWith("http://")||link.startsWith("https://")));go.href=`order.html?type=smm&serviceId=${encodeURIComponent(selected.serviceId||'')}&product=${encodeURIComponent(product.name||'SMM Services')}&package=${encodeURIComponent(selected.name||selected.title||'SMM Service')}&price=${encodeURIComponent('NPR '+price)}&unitPrice=${encodeURIComponent(selected.price||0)}&quantity=${n}&targetUrl=${encodeURIComponent(link)}`}qty.addEventListener('input',update);target.addEventListener('input',update);(async()=>{try{product=await(await fetch(`${API}/api/products/slug/${encodeURIComponent(slug)}`)).json();const r=await(await fetch(`${API}/api/product-items/product/${product._id}`)).json();const items=(r.items||r.data||r).filter(x=>x.active!==false);draw(items.filter(x=>String(x.name||x.title).toLowerCase().includes('instagram')),$('instagramServices'));draw(items.filter(x=>String(x.name||x.title).toLowerCase().includes('tiktok')),$('tiktokServices'))}catch(e){$('instagramServices').textContent='Unable to load services';$('tiktokServices').textContent='Unable to load services';console.error(e)}})();</script></body></html>
